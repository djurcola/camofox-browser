name: Sync upstream into homelab
run-name: Camofox upstream sync · ${{ github.run_number }}

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: camofox-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare candidate merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      blocked: ${{ steps.merge.outputs.blocked }}
      candidate_sha: ${{ steps.merge.outputs.candidate_sha }}
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
      conflict_files: ${{ steps.merge.outputs.conflict_files }}
    steps:
      - name: Checkout trusted homelab branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: homelab
          fetch-depth: 0

      - name: Merge upstream without accepting upstream workflows
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote remove upstream >/dev/null 2>&1 || true
          git remote add upstream https://github.com/jo-inc/camofox-browser.git
          fetch_ok=false
          for attempt in 1 2 3; do
            if git fetch --no-tags upstream refs/heads/master; then
              fetch_ok=true
              break
            fi
            printf 'Upstream fetch attempt %s/3 failed; retrying.\n' "$attempt" >&2
            sleep $((attempt * 5))
          done
          [[ "$fetch_ok" == true ]]

          upstream_sha=$(git rev-parse upstream/master)

          block_sync() {
            local reason="$1"
            local conflict_files
            conflict_files=$(git diff --name-only --diff-filter=U | paste -sd, -)
            conflict_files=${conflict_files:-none}
            {
              printf '# Camofox upstream sync blocked\n\n'
              printf '%s\n' "Reason: $reason"
              printf '%s\n' "Upstream commit: $upstream_sha"
              printf '%s\n\n' "Conflicting paths: $conflict_files"
              git status --short
              printf '\n## Combined conflict diff\n\n'
              git diff --cc || true
            } | tee "$RUNNER_TEMP/camofox-sync-conflict.md" >&2
            {
              printf 'changed=false\n'
              printf 'blocked=true\n'
              printf 'candidate_sha=%s\n' "$(git rev-parse HEAD)"
              printf 'upstream_sha=%s\n' "$upstream_sha"
              printf 'conflict_files=%s\n' "$conflict_files"
            } >> "$GITHUB_OUTPUT"
            {
              printf '## Upstream sync blocked\n\n'
              printf '%s\n' "$reason"
              printf '\nUpstream revision: `%s`\n' "$upstream_sha"
              printf 'Conflicting paths: `%s`\n' "$conflict_files"
              printf '\nThe homelab branch was not changed. An issue will be opened or reused for this upstream revision.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort >/dev/null 2>&1 || true
          }

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'blocked=false' >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff upstream/master
          merge_rc=$?
          set -e

          # Our workflows are the trust boundary. Never import upstream .github changes.
          # Resolve unmerged paths first because restore refuses modify/delete entries.
          while IFS= read -r -d '' path; do
            [[ -n "$path" ]] || continue
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              git checkout HEAD -- "$path"
              git add -- "$path"
            else
              git rm -- "$path"
            fi
          done < <(git diff --name-only -z --diff-filter=U -- .github)

          # Drop upstream-only .github files, then restore all trusted files.
          while IFS= read -r -d '' path; do
            [[ -n "$path" ]] || continue
            git rm -- "$path"
          done < <(git diff --cached --name-only -z --diff-filter=A -- .github)
          git restore --source=HEAD --staged --worktree -- .github
          trusted_status=$(git status --short -- .github)
          if [[ -n "$trusted_status" ]]; then
            printf 'Trusted workflow tree changed unexpectedly:\n%s\n' "$trusted_status" >&2
            block_sync 'trusted workflow tree changed unexpectedly'
            exit 0
          fi

          # README is documentation, so combine non-overlapping additions from
          # both sides. Keep every other non-.github conflict fail-closed.
          if git diff --name-only --diff-filter=U -- README.md | grep -qx 'README.md'; then
            base_sha=$(git merge-base HEAD upstream/master)
            ours_file="$RUNNER_TEMP/camofox-readme-ours"
            base_file="$RUNNER_TEMP/camofox-readme-base"
            theirs_file="$RUNNER_TEMP/camofox-readme-theirs"
            git show ':2:README.md' > "$ours_file"
            git show "$base_sha:README.md" > "$base_file"
            git show ':3:README.md' > "$theirs_file"
            cp "$ours_file" README.md
            if ! git merge-file --union README.md "$base_file" "$theirs_file"; then
              block_sync 'README union merge failed; refusing to guess'
              exit 0
            fi
            git add README.md
          fi
          unresolved=$(git diff --name-only --diff-filter=U)
          if [[ -n "$unresolved" ]]; then
            block_sync "unresolved upstream conflicts: ${unresolved//$'\n'/, }"
            exit 0
          fi
          if [[ "$merge_rc" -ne 0 ]]; then
            echo 'The only merge conflicts were under .github and were resolved in favor of homelab.'
          fi

          upstream_sha=$(git rev-parse upstream/master)
          git add -A
          git commit -m "chore(sync): merge upstream master ${upstream_sha:0:12}"
          candidate_sha=$(git rev-parse HEAD)
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          git push --force-with-lease origin \
            "$candidate_sha:refs/heads/automation/upstream-sync"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo 'blocked=false' >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

      - name: Preserve merge conflict report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: camofox-upstream-sync-report-${{ github.run_number }}
          path: ${{ runner.temp }}/camofox-sync-conflict.md
          if-no-files-found: ignore

  report:
    name: Report blocked sync
    if: needs.prepare.outputs.blocked == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open one issue for the blocked upstream revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          CONFLICT_FILES: ${{ needs.prepare.outputs.conflict_files }}
        run: |
          set -euo pipefail
          short_sha=${UPSTREAM_SHA:0:12}
          title="Camofox upstream sync blocked: ${short_sha}"
          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            printf 'Using existing tracking issue #%s.\n' "$existing"
            exit 0
          fi
          body=$(printf '%s\n' \
            'The scheduled Camofox upstream sync is blocked by a merge conflict.' \
            '' \
            "Upstream revision: \`${UPSTREAM_SHA}\`" \
            "Conflicting paths: \`${CONFLICT_FILES}\`" \
            '' \
            "Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '' \
            'The homelab branch was not changed. Resolve the conflict, close this issue, and rerun the workflow.')
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"

  validate:
    name: Validate and publish candidate
    if: needs.prepare.outputs.changed == 'true'
    needs: prepare
    uses: ./.github/workflows/homelab-ci-publish.yml
    with:
      source_ref: automation/upstream-sync
      promote_stable: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  promote:
    name: Promote tested source and image
    if: needs.prepare.outputs.changed == 'true'
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout trusted homelab branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: homelab
          fetch-depth: 0

      - name: Validate promotion inputs and fast-forward homelab
        id: source
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          VERIFIED_SHA: ${{ needs.validate.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]
          [[ "$CANDIDATE_SHA" == "$VERIFIED_SHA" ]]

          git fetch origin refs/heads/automation/upstream-sync
          fetched_sha=$(git rev-parse FETCH_HEAD)
          [[ "$fetched_sha" == "$CANDIDATE_SHA" ]]
          git merge-base --is-ancestor HEAD "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/homelab"
          echo "short_sha=${CANDIDATE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the verified digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.validate.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]
          [[ "$SHORT_SHA" =~ ^[0-9a-f]{12}$ ]]
          source_image="ghcr.io/djurcola/camofox-browser@${IMAGE_DIGEST}"
          docker buildx imagetools create \
            --tag ghcr.io/djurcola/camofox-browser:homelab-stable \
            --tag "ghcr.io/djurcola/camofox-browser:${VERSION}-homelab.${SHORT_SHA}" \
            "$source_image"

      - name: Remove temporary candidate branch
        if: success()
        shell: bash
        run: git push origin --delete automation/upstream-sync
