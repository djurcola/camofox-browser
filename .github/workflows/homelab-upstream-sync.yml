name: Sync upstream into homelab
run-name: Camofox upstream sync · ${{ github.run_number }}

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: camofox-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare candidate merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      candidate_sha: ${{ steps.merge.outputs.candidate_sha }}
    steps:
      - name: Checkout trusted homelab branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: homelab
          fetch-depth: 0

      - name: Merge upstream without accepting upstream workflows
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote remove upstream >/dev/null 2>&1 || true
          git remote add upstream https://github.com/jo-inc/camofox-browser.git
          git fetch --no-tags upstream refs/heads/master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff upstream/master
          merge_rc=$?
          set -e

          # Our workflows are the trust boundary. Never import upstream .github changes.
          git restore --source=HEAD --staged --worktree -- .github
          unresolved=$(git diff --name-only --diff-filter=U)
          if [[ -n "$unresolved" ]]; then
            printf 'Unresolved upstream conflicts:\n%s\n' "$unresolved" >&2
            git merge --abort || true
            exit 1
          fi
          if [[ "$merge_rc" -ne 0 ]]; then
            echo 'The only merge conflicts were under .github and were resolved in favor of homelab.'
          fi

          upstream_sha=$(git rev-parse upstream/master)
          git add -A
          git commit -m "chore(sync): merge upstream master ${upstream_sha:0:12}"
          candidate_sha=$(git rev-parse HEAD)
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          git push --force-with-lease origin \
            "$candidate_sha:refs/heads/automation/upstream-sync"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate and publish candidate
    if: needs.prepare.outputs.changed == 'true'
    needs: prepare
    uses: ./.github/workflows/homelab-ci-publish.yml
    with:
      source_ref: automation/upstream-sync
      promote_stable: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  promote:
    name: Promote tested source and image
    if: needs.prepare.outputs.changed == 'true'
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout trusted homelab branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: homelab
          fetch-depth: 0

      - name: Validate promotion inputs and fast-forward homelab
        id: source
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          VERIFIED_SHA: ${{ needs.validate.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]
          [[ "$CANDIDATE_SHA" == "$VERIFIED_SHA" ]]

          git fetch origin refs/heads/automation/upstream-sync
          fetched_sha=$(git rev-parse FETCH_HEAD)
          [[ "$fetched_sha" == "$CANDIDATE_SHA" ]]
          git merge-base --is-ancestor HEAD "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/homelab"
          echo "short_sha=${CANDIDATE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the verified digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.validate.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]
          [[ "$SHORT_SHA" =~ ^[0-9a-f]{12}$ ]]
          source_image="ghcr.io/djurcola/camofox-browser@${IMAGE_DIGEST}"
          docker buildx imagetools create \
            --tag ghcr.io/djurcola/camofox-browser:homelab-stable \
            --tag "ghcr.io/djurcola/camofox-browser:${VERSION}-homelab.${SHORT_SHA}" \
            "$source_image"

      - name: Remove temporary candidate branch
        if: success()
        shell: bash
        run: git push origin --delete automation/upstream-sync
