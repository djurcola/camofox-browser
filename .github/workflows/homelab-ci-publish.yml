name: Homelab CI and image
run-name: Camofox CI · ${{ inputs.source_ref || github.ref_name }}

on:
  push:
    branches: [homelab]
  pull_request:
    branches: [homelab]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional branch, tag, or SHA to build
        required: false
        default: ''
        type: string
      promote_stable:
        description: Promote the verified image to homelab-stable
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      source_ref:
        description: Branch, tag, or SHA to build
        required: true
        type: string
      promote_stable:
        description: Promote the verified image to homelab-stable
        required: false
        default: false
        type: boolean
    outputs:
      digest:
        description: Verified top-level OCI digest
        value: ${{ jobs.image.outputs.digest }}
      source_sha:
        description: Source commit built into the image
        value: ${{ jobs.image.outputs.source_sha }}
      version:
        description: Camofox package version
        value: ${{ jobs.image.outputs.version }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: djurcola/camofox-browser
  SOURCE_REF: ${{ inputs.source_ref || github.ref }}

concurrency:
  group: camofox-ci-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: Unit, plugin and MCP tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Build package
        run: npm run build

      - name: Verify standalone MCP package
        run: npm run test:mcp

      - name: Run unit and plugin tests
        env:
          CI: 'true'
        run: |
          node --experimental-vm-modules node_modules/.bin/jest \
            --testPathPatterns='tests/unit|plugins' \
            --testPathIgnorePatterns='security\.test|tabRecycling\.test|cookies\.test' \
            --runInBand --forceExit

  e2e:
    name: Browser and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Install Firefox and system dependencies
        run: npx playwright install --with-deps firefox

      - name: Run end-to-end tests
        env:
          CI: 'true'
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --config jest.config.e2e.cjs \
              --runInBand --forceExit

      - name: Run browser-dependent unit tests
        env:
          CI: 'true'
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --testPathPatterns='tests/unit/(security|tabRecycling|cookies)\.test' \
              --runInBand --forceExit

  image:
    name: Build, smoke-test and publish image
    if: github.event_name != 'pull_request'
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Validate source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./package.json').version")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$version" =~ ^[0-9A-Za-z._-]+$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ steps.source.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/djurcola/camofox-browser
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            io.djurcola.camofox.channel=homelab
          cache-from: type=gha,scope=camofox-amd64
          cache-to: type=gha,mode=max,scope=camofox-amd64
          provenance: mode=max
          sbom: true

      - name: Smoke-test the exact published digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "$image"
          docker run -d --name camofox-smoke \
            -p 127.0.0.1:19377:9377 \
            -p 127.0.0.1:16080:6080 \
            -e CAMOFOX_CRASH_REPORT_ENABLED=false \
            -e ENABLE_VNC=1 \
            -e VNC_RESOLUTION=1280x1024 \
            -e VNC_MATCH_WINDOW_TO_DISPLAY=1 \
            -e VNC_BIND=0.0.0.0 \
            "$image"
          cleanup() {
            docker logs camofox-smoke > "$RUNNER_TEMP/camofox-smoke.log" 2>&1 || true
            docker rm -f camofox-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:19377/health > "$RUNNER_TEMP/health.json"; then
              if python3 - "$RUNNER_TEMP/health.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              health = json.load(fh)
          assert health.get('ok') is True, health
          assert health.get('consecutiveFailures') == 0, health
          PY
              then
                ready=true
                break
              fi
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs camofox-smoke
            exit 1
          fi

          actual_version=$(docker exec camofox-smoke node -p "require('/app/package.json').version")
          [[ "$actual_version" == "$EXPECTED_VERSION" ]]
          docker exec camofox-smoke test -f /app/mcp/lib/cookies.mjs
          docker exec camofox-smoke test -f /app/mcp/lib/tool-contracts.mjs
          curl -fsS --max-time 10 http://127.0.0.1:16080/vnc.html >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:19377/vnc/status > "$RUNNER_TEMP/vnc-status.json"
          python3 - "$RUNNER_TEMP/vnc-status.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              status = json.load(fh)
          assert status.get('enabled') is True, status
          assert status.get('watcherRunning') is True, status
          PY
          python3 - <<'PY'
          import base64, os, socket
          key = base64.b64encode(os.urandom(16)).decode()
          request = (
              'GET /websockify HTTP/1.1\r\n'
              'Host: 127.0.0.1:16080\r\n'
              'Upgrade: websocket\r\n'
              'Connection: Upgrade\r\n'
              f'Sec-WebSocket-Key: {key}\r\n'
              'Sec-WebSocket-Version: 13\r\n\r\n'
          ).encode()
          with socket.create_connection(('127.0.0.1', 16080), timeout=10) as sock:
              sock.sendall(request)
              response = sock.recv(4096).decode('latin1', errors='replace')
          assert response.startswith('HTTP/1.1 101'), response
          PY
          logs=$(docker logs camofox-smoke 2>&1)
          grep -Eiq 'plugin loaded.*persistence|persistence.*plugin loaded' <<<"$logs"
          grep -Eiq 'plugin loaded.*youtube|youtube.*plugin loaded' <<<"$logs"
          grep -Eiq 'plugin loaded.*vnc|vnc.*plugin loaded' <<<"$logs"

      - name: Attest verified image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote verified image
        if: inputs.promote_stable || github.event_name == 'push'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.source.outputs.version }}
          SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]
          [[ "$SHORT_SHA" =~ ^[0-9a-f]{12}$ ]]
          source_image="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:homelab-stable" \
            --tag "${REGISTRY}/${IMAGE_NAME}:${VERSION}-homelab.${SHORT_SHA}" \
            "$source_image"
